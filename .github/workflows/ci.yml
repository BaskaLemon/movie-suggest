name: CI

# Catches lint, type and build errors before Vercel deploys a broken commit.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The db scripts and the Prisma CLI run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bunx next typegen && bunx tsc --noEmit

      # No secrets needed: without DATABASE_URL the build migrates a throwaway local SQLite
      # file, and without TMDB_API_KEY pages render from the demo catalogue.
      - name: Build
        run: bun run build
